[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pisti-rl"
version = "0.1.0"
description = "Modular RL framework for learning optimal play in Pişti card game"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "Cem Vural"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0",
    "gymnasium>=0.29.0",
    "stable-baselines3>=2.0.0",
    "sb3-contrib>=2.0.0",
    "torch>=2.0.0",
    "pyyaml>=6.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tensorboard>=2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
pisti-train = "training.train:main"
pisti-eval = "training.evaluate:main"

[tool.setuptools.packages.find]
include = ["agents*", "analysis*", "encoding*", "engine*", "envs*", "training*"]
exclude = ["configs*", "logs*", "models*", "plots*", "results*", "runs*", "scripts*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]
