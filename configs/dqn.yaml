# Pişti RL — masked DQN + curriculum + self-play league

run_name: dqn_main
out_dir: runs
seed: 0
n_envs: 8
total_timesteps: 6_000_000
algorithm: dqn

reward:
  mode: delta
  scale: 0.1

observer:
  memory: true

dqn:
  learning_rate: 1.0e-4
  buffer_size: 300_000
  learning_starts: 20_000
  batch_size: 256
  gamma: 0.999
  train_freq: 4          # env steps (vectorized) between updates
  gradient_steps: 4
  target_update_interval: 10_000
  exploration_fraction: 0.2
  exploration_final_eps: 0.05
  net_arch: [256, 256]

curriculum:
  - at: 0
    weights: {random: 0.5, greedy: 0.5}
  - at: 300_000
    weights: {greedy: 0.6, hunter: 0.4}
  - at: 1_000_000
    weights: {greedy: 0.2, hunter: 0.2, pool: 0.4, latest: 0.2}
  - at: 2_500_000
    weights: {greedy: 0.1, hunter: 0.1, expectimax: 0.1, pool: 0.45, latest: 0.25}

selfplay:
  snapshot_freq: 250_000
  pool_size: 12

eval:
  freq: 250_000
  n_deals: 150
