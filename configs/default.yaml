# Default configuration for Pişti RL training

game:
  expose_bottom_card: false  # Expose bottom card of stock as public info
  pisti_exceptions: []  # Configurable edge cases (e.g., no pişti on first capture)

reward:
  sparse: false  # Use sparse rewards (only terminal) - disabled by default to enable shaping
  shaping:
    enabled: true  # Enable reward shaping (default: enabled for better learning)
    capture_bonus: 0.15  # Bonus for capturing pile
    ace_bonus: 1.0  # Bonus for capturing Ace (matches game scoring)
    jack_bonus: 1.0  # Bonus for capturing Jack (matches game scoring)
    two_clubs_bonus: 2.0  # Bonus for capturing 2♣ (matches game scoring)
    ten_diamonds_bonus: 3.0  # Bonus for capturing 10♦ (matches game scoring)
    pisti_bonus: 10.0  # Bonus for pişti
    capture_pile_size_bonus: 0.05  # Bonus per card captured (pile size reward)
    majority_bonus: 3.0  # Bonus for achieving majority advantage

encoding:
  encoder_type: "MultiHotEncoder"  # Options: MultiHotEncoder, CNNEncoder, FeatureEncoder, SequenceEncoder
  mode: "feature"  # For FeatureEncoder/SequenceEncoder: "feature" or "sequence"
  include_history: false  # Include move history
  history_length: 10  # Length of history sequence
  include_cnn_views: false  # If true, add (4,13) reshaped tensors (for CNNEncoder)

training:
  algorithm: "MaskablePPO"  # Options: PPO, MaskablePPO, RecurrentPPO, DQN, RainbowDQN, NFSP, DeepCFR, R2D2
  total_timesteps: 1_000_000  # Total training timesteps
  seed: 42  # Random seed
  use_deep_architecture: true  # Use deep networks (false = benchmark shallow/medium)
  
  opponent:
    type: "random"  # Initial opponent (overridden by curriculum if enabled)
    switch_to_self_play_at: 0  # Deprecated: use curriculum_phases instead
    probabilistic_config:
      max_samples: 50
      depth: 1
  
  # Curriculum learning: progressive opponent difficulty
  curriculum:
    enabled: true  # Enable curriculum learning
    phases:
      # Phase 1: Random opponent (0-200K steps) - learn basic rules
      - timestep: 0
        opponent_type: "random"
        opponent_kwargs: {}
      
      # Phase 2: Greedy opponent (200K-400K steps) - learn to capture
      - timestep: 200000
        opponent_type: "greedy"
        opponent_kwargs: {}
      
      # Phase 3: Pişti hunter (400K-600K steps) - learn pişti tactics
      - timestep: 400000
        opponent_type: "pisti_hunter"
        opponent_kwargs: {}
      
      # Phase 4: Probabilistic with high temperature (600K-800K steps) - learn strategy
      - timestep: 600000
        opponent_type: "probabilistic"
        opponent_kwargs:
          temperature: 2.0  # High temperature = easier opponent
          max_samples: 50
          depth: 1
      
      # Phase 5: Probabilistic with medium temperature (800K-900K steps) - refine strategy
      - timestep: 800000
        opponent_type: "probabilistic"
        opponent_kwargs:
          temperature: 1.0  # Medium temperature
          max_samples: 50
          depth: 1
      
      # Phase 6: Self-play (900K+ steps) - optimize against self
      - timestep: 900000
        opponent_type: "self_play"
        opponent_kwargs: {}
  
  self_play:
    enabled: true  # Enable self-play training (used in curriculum Phase 6)
    opponent_pool_size: 5  # Maximum opponents in pool
    snapshot_frequency: 50000  # Frequency of checkpoints to add to pool
  
  # Network architectures
  network_architectures:
    # Deep models (primary)
    deep:
      pi: [256, 256, 128]      # Policy network layers
      vf: [256, 256, 128]      # Value network layers
      qf: [256, 256, 128]      # Q-network layers (for DQN)
    
    # Benchmark models (for comparison)
    shallow:
      pi: [64, 64]
      vf: [64, 64]
      qf: [64, 64]
    
    medium:
      pi: [128, 128]
      vf: [128, 128]
      qf: [128, 128]
    
    # Recurrent models
    recurrent:
      lstm_hidden_size: 256
      lstm_layers: 2
      mlp_layers: [128, 128]
    
    # NFSP specific
    nfsp:
      average_strategy: [256, 256, 128]
      best_response: [256, 256, 128]
    
    # Deep CFR specific
    deep_cfr:
      counterfactual_value: [256, 256, 256, 128]
      strategy: [256, 256, 128]
  
  # Algorithm-specific parameters
  ppo:
    learning_rate: 3.0e-4
    n_steps: 2048  # Number of steps per update
    batch_size: 64
    n_epochs: 10  # Number of epochs per update
    gamma: 0.99  # Discount factor
    gae_lambda: 0.95  # GAE lambda
    clip_range: 0.2  # PPO clip range
    ent_coef: 0.01  # Entropy coefficient
    vf_coef: 0.5  # Value function coefficient
    max_grad_norm: 0.5  # Gradient clipping
  
  maskable_ppo:
    learning_rate: 1.0e-4
    n_steps: 2048
    batch_size: 64
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.01
    vf_coef: 0.5
    max_grad_norm: 0.5
  
  recurrent_ppo:
    learning_rate: 3.0e-4
    n_steps: 2048
    batch_size: 64
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.01
    vf_coef: 0.5
    max_grad_norm: 0.5
    lstm_hidden_size: 256
    lstm_layers: 2
    mlp_layers: [128, 128]
  
  dqn:
    learning_rate: 1.0e-4
    buffer_size: 100000  # Replay buffer size
    learning_starts: 1000  # Steps before learning starts
    batch_size: 32
    tau: 1.0  # Soft update coefficient (1.0 = hard update)
    gamma: 0.99  # Discount factor
    train_freq: 4  # Train every N steps
    gradient_steps: 1  # Number of gradient steps per update
    target_update_interval: 1000  # Update target network every N steps
    exploration_fraction: 0.1  # Fraction of training for exploration
    exploration_initial_eps: 1.0  # Initial epsilon
    exploration_final_eps: 0.05  # Final epsilon
  
  rainbow_dqn:
    learning_rate: 1.0e-4
    buffer_size: 100000
    learning_starts: 1000
    batch_size: 32
    tau: 1.0
    gamma: 0.99
    train_freq: 4
    gradient_steps: 1
    target_update_interval: 1000
    exploration_fraction: 0.1
    exploration_initial_eps: 1.0
    exploration_final_eps: 0.05
  
  nfsp:
    learning_rate: 1.0e-4
    anticipatory_param: 0.1  # η in NFSP
    average_strategy_update_freq: 1000  # Update average strategy every N steps
    reservoir_buffer_size: 10000  # Size of reservoir buffer
    batch_size: 32
    train_freq: 4
    use_gpu: false
  
  deep_cfr:
    learning_rate: 1.0e-4
    regret_matching_epsilon: 0.001
    traversal_batch_size: 32
    use_gpu: false
  
  r2d2:
    learning_rate: 1.0e-4
    gamma: 0.99
    n_step: 5  # N-step returns
    tau: 1.0  # Target network update
    batch_size: 32
    buffer_size: 100000
    learning_starts: 1000
    train_freq: 4
    replay_alpha: 0.6  # Prioritized replay alpha
    replay_beta: 0.4  # Prioritized replay beta
    exploration_fraction: 0.1
    exploration_initial_eps: 1.0
    exploration_final_eps: 0.05
    use_gpu: false

evaluation:
  eval_freq: 10000  # Evaluate every N steps
  n_eval_episodes: 10  # Number of episodes for evaluation
  eval_opponents: ["random", "greedy"]  # Opponents to evaluate against

logging:
  log_dir: "./logs"  # Directory for logs
  tensorboard_log: "./logs/tensorboard"  # TensorBoard log directory
  save_freq: 50000  # Save checkpoint every N steps
  models_dir: "./models"  # Base directory for models (organized by algorithm)
  # Legacy: kept for backward compatibility, but models_dir is preferred
  save_path: "./checkpoints"  # Deprecated: use models_dir instead
