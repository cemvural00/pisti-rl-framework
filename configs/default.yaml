# Pişti RL — MaskablePPO + curriculum + self-play league

run_name: ppo_main
out_dir: runs
seed: 0
n_envs: 8
total_timesteps: 6_000_000

reward:
  mode: delta        # "delta" (per-step score-diff change) or "sparse" (terminal only)
  scale: 0.1         # episode return = 0.1 * final score differential

observer:
  memory: true       # false = card-counting ablation (seen vector zeroed)

ppo:
  learning_rate: 3.0e-4
  n_steps: 256       # per env -> 2048-step rollouts with 8 envs
  batch_size: 512
  n_epochs: 4
  gamma: 0.999       # episodes are 24 decisions; near-undiscounted
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [256, 256]

# Opponent mixture by training timestep. Types:
#   random/greedy/hunter/expectimax = scripted; pool = league snapshots;
#   latest = live policy (mirror self-play)
curriculum:
  - at: 0
    weights: {random: 0.5, greedy: 0.5}
  - at: 300_000
    weights: {greedy: 0.6, hunter: 0.4}
  - at: 1_000_000
    weights: {greedy: 0.2, hunter: 0.2, pool: 0.4, latest: 0.2}
  - at: 2_500_000
    weights: {greedy: 0.1, hunter: 0.1, expectimax: 0.1, pool: 0.45, latest: 0.25}

selfplay:
  snapshot_freq: 250_000
  pool_size: 12

eval:
  freq: 250_000
  n_deals: 150       # mirrored -> 300 games vs greedy/hunter, 1/3 vs expectimax
